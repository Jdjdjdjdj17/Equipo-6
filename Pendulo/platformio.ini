
[platformio]
default_envs = pendulo

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
upload_port = COM3
monitor_port = COM3
monitor_echo = yes

[env:pendulo]
build_src_filter = +<*>

[env:pruebas]
build_src_filter = -<*> +<../pruebas/pruebas.cpp>
