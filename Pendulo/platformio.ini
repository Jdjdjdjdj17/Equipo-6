; Péndulo PID – proyecto para VS Code + PlatformIO
; Abre esta carpeta en VS Code (con la extensión PlatformIO IDE instalada).
; Compilar: ✓ (barra de abajo)   Subir: →   Monitor: 🔌
; Hay DOS programas. Elige cuál subir en la barra de abajo (donde dice env:...):
;   env:pendulo  -> el programa del péndulo (src/main.cpp)
;   env:pruebas  -> menú para probar cada componente por separado (pruebas/pruebas.cpp)

[platformio]
default_envs = pendulo

[env]
; Plataforma oficial de PlatformIO (el código funciona con Arduino-ESP32 2.x y 3.x)
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
upload_port = COM3
monitor_port = COM3
monitor_echo = yes

[env:pendulo]
build_src_filter = +<*>

[env:pruebas]
build_src_filter = -<*> +<../pruebas/pruebas.cpp>
